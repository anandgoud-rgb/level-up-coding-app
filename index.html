  {title:'Main Menu',        concept:'Switch Statement',           icon:'📋'},
  {title:'Balance Enquiry',  concept:'Variables · Output',         icon:'💰'},
  {title:'Deposit Money',    concept:'Operators · Input',          icon:'➕'},
  {title:'Withdraw Money',   concept:'Operators · Decision',       icon:'➖'},
  {title:'Fast Cash',        concept:'Switch Statement',           icon:'⚡'},
  {title:'Mini Statement',   concept:'Loops',                      icon:'🧾'},
  {title:'ATM Decorator',    concept:'Nested Loops · Patterns',    icon:'🎨'}
];
const rupees=n=>'₹'+(Number(n)||0).toLocaleString('en-IN');

function ensureATM(){
  if(state.atm)return;
  state.atm={
    stage:0, progress:0, done:false, awarded:{},
    bank:'Code Bank', customer:state.name||'', account:''+Math.floor(1e11+Math.random()*8e11),
    pin:'1234', balance:5000, loggedIn:false, entry:'',
    transactions:[], menuWired:{}, deco:{color:'#38e1ff',colorChosen:false,pattern:false},
    view:'welcome', used:{}
  };
}
// count a stage as done + award XP once
function markStage(n){ if(state.atm.progress<n)state.atm.progress=n; if(!state.atm.awarded[n]){state.atm.awarded[n]=true;state.xp+=40;} }
function pushTxn(type,amount){state.atm.transactions.push({type,amount});if(state.atm.transactions.length>20)state.atm.transactions.shift();}

// falling money/coins animation (pure CSS + a few DOM elements)
function moneyAnim(emoji,count){emoji=emoji||'💵';count=count||14;
  for(let i=0;i<count;i++){const c=el('div','coin',emoji);c.style.left=(Math.random()*96)+'vw';
    const dur=1.2+Math.random()*1.3;c.style.animation=`coinfall ${dur}s linear forwards`;c.style.animationDelay=(Math.random()*.5)+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),(dur+0.7)*1000);}
}

// The ATM machine chassis (brand + screen + card slot)
function atmFrame(body,opts){
  opts=opts||{};
  const wrap=el('div','atm-wrap');
  const atm=el('div','atm');
  const brand=el('div','atm-brand',`<span class="chip"></span> ${esc(state.atm.bank)} 🏧`);
  if(state.atm.deco&&state.atm.deco.colorChosen){atm.style.borderColor=state.atm.deco.color;brand.style.color=state.atm.deco.color;}
  atm.appendChild(brand);
  const screen=el('div','atm-screen');
  if(typeof body==='string')screen.innerHTML=body; else screen.appendChild(body);
  atm.appendChild(screen);
  atm.appendChild(el('div','atm-slot'+(opts.blink?' blink':'')));
  atm.appendChild(el('div','atm-slot-label',opts.slotLabel||'💳 CARD & RECEIPT SLOT'));
  wrap.appendChild(atm);
  return wrap;
}
// numeric keypad that manages the PIN entry
function atmKeypad(onEnter){
  const box=el('div');
  const dots=el('div','pin-dots');
  const upd=()=>{dots.innerHTML=state.atm.entry.length?'•'.repeat(state.atm.entry.length):'<span style="opacity:.4;font-size:.9rem;letter-spacing:0">enter PIN</span>';};
  upd();box.appendChild(dots);
  const pad=el('div','keypad');
  ['1','2','3','4','5','6','7','8','9','C','0','↵'].forEach(k=>{
    const key=el('button','key',k);
    key.onclick=()=>{Audio_.pick();
      if(k==='C'){state.atm.entry='';upd();return;}
      if(k==='↵'){onEnter(state.atm.entry);return;}
      if(state.atm.entry.length<6){state.atm.entry+=k;upd();}
    };
    pad.appendChild(key);
  });
  box.appendChild(pad);return box;
}
// stage progress dots + header
function atmDots(cur){const d=el('div','stage-dots');
  for(let i=1;i<=10;i++)d.appendChild(el('div','sd'+(i<=state.atm.progress?' on':'')+(i===cur?' cur':'')));return d;}
function atmHeader(n){const m=ATM_STAGES[n-1];
  return el('div','glass card',`<div class="eyebrow">Stage ${n} / 10 · Uses: ${m.concept}</div>
    <div style="font-family:var(--font-display);font-weight:800;font-size:1.15rem">${m.icon} ${m.title}</div>`);}
// Continue button (only after the stage's task is complete)
function atmCont(n){
  if(state.atm.progress<n)return null;
  const last=n===10;
  const b=el('button','btn cyan',last?'🏆 Enter Final Test':'Continue to Stage '+(n+1)+' →');
  b.onclick=()=>{Audio_.click();state.atm.entry='';
    if(last){initFinal();state.atm.stage=11;}else{state.atm.stage=n+1;}
    render();};
  const f=el('div','footbar');f.style.justifyContent='center';f.appendChild(b);return f;
}
function stageBox(n,body,extra){
  const m=ATM_STAGES[n-1];const box=el('div');
  box.appendChild(learnBanner('🏧','This stage uses '+m.concept+'.'));
  box.appendChild(atmDots(n));
  box.appendChild(atmHeader(n));
  box.appendChild(atmFrame(body,{blink:n===1&&state.atm.progress<1}));
  if(extra)box.appendChild(extra);
  const c=atmCont(n);if(c)box.appendChild(c);
  return box;
}

/* ---- ATM router ---- */
function screenATM(){
  ensureATM();
  const s=state.atm.stage;
  if(s===0)return atmIntro();
  if(s>=1&&s<=10)return atmStage(s);
  if(s===11)return atmFinalTest();
  return atmDone();
}

function atmIntro(){
  const box=el('div');
  const c=el('div','card glass center');
  c.innerHTML=`<div class="eyebrow" style="justify-content:center">Capstone Project</div>
    <div class="illus" style="font-size:70px">🏧</div>
    <h1 style="background:linear-gradient(135deg,#38e1ff,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent">Build a Real ATM</h1>
    <p class="muted" style="max-width:540px;margin:0 auto;font-weight:600">You've learned 9 concepts. Now you'll use <b>all of them together</b> to build a working ATM machine — one stage at a time.</p>
    <div class="feat" style="justify-content:center;margin-top:14px">
      <span>👋 Hello World</span><span>📦 Variables</span><span>🔤 Data Types</span><span>⌨️ Input</span><span>➗ Operators</span><span>🚦 Decisions</span><span>🔀 Switch</span><span>🔁 Loops</span><span>✨ Patterns</span></div>`;
  const btn=el('button','btn gold','Start Building 🏧');btn.style.marginTop='20px';
  btn.onclick=()=>{Audio_.click();state.atm.stage=1;render();};
  c.appendChild(btn);box.appendChild(c);return box;
}

function atmStage(n){
  const a=state.atm;

  /* ---------- STAGE 1 · WELCOME (Output / Hello World) ---------- */
  if(n===1){
    const body=el('div');
    body.innerHTML=`<h3>${esc(a.bank)}</h3><div class="sub">Welcome! This screen just <b>displays text</b> — that's <b>output</b>, exactly like your first Hello World program.</div>`;
    if(a.progress>=1){
      body.innerHTML+=`<div class="sub" style="color:#7dffb0;font-weight:800;margin-top:10px">✅ Great! You created your first ATM screen.</div>`;
      const cont=el('button','abtn ghost','Continue Button ▸');cont.disabled=true;body.appendChild(cont);
    }else{
      const ins=el('button','abtn gold','Insert Card 💳');
      ins.onclick=()=>{moneyAnim('💳',5);markStage(1);Audio_.correct();toast('✅ First ATM screen created!');render();};
      body.appendChild(ins);
    }
    return stageBox(1,body);
  }

  /* ---------- STAGE 2 · ACCOUNT DETAILS (Variables · Data Types) ---------- */
  if(n===2){
    const body=el('div');
    body.innerHTML=`<h3>Set up the account</h3><div class="sub">Type the details. Each one is stored in a <b>variable</b> with a <b>data type</b>.</div>`;
    const mkF=(label,val,numeric,onIn,maxlen)=>{const f=el('div','field atm-field');f.innerHTML=`<label style="color:#a9d6ea">${label}</label>`;
      const i=el('input');i.value=val;if(numeric)i.inputMode='numeric';if(maxlen)i.maxLength=maxlen;
      i.addEventListener('input',()=>onIn(i.value));f.appendChild(i);return f;};
    body.appendChild(mkF('Customer Name',a.customer,false,v=>a.customer=v));
    body.appendChild(mkF('Account Number',a.account,true,v=>a.account=v));
    body.appendChild(mkF('PIN (4 digits)',a.pin,true,v=>a.pin=v.slice(0,4),4));
    body.appendChild(mkF('Opening Balance (₹)',a.balance,true,v=>a.balance=Number(v)||0));
    const vb=el('div');vb.style.marginTop='4px';
    vb.innerHTML=`<div class="var-box">customerName <span class="type text">Text</span></div>
      <div class="var-box">accountNumber <span class="type num">Number</span></div>
      <div class="var-box">pin <span class="type num">Number</span></div>
      <div class="var-box">balance <span class="type num">Number</span></div>`;
    body.appendChild(vb);
    const save=el('button','abtn gold','Save Account 💾');
    save.onclick=()=>{if(!a.customer.trim()||String(a.pin).length!==4){toast('Add a name and a 4-digit PIN');Audio_.wrong();return;}
      markStage(2);Audio_.correct();toast('✅ Saved into variables!');render();};
    body.appendChild(save);
    if(a.progress>=2)body.appendChild(el('div','sub',`✅ Stored: ${esc(a.customer)} · ${rupees(a.balance)}`));
    return stageBox(2,body);
  }

  /* ---------- STAGE 3 · LOGIN (Input · Decision) ---------- */
  if(n===3){
    const body=el('div');
    if(a.progress>=3){
      body.innerHTML=`<h3>Logged in ✅</h3><div class="sub" style="color:#7dffb0;font-weight:800">Welcome, ${esc(a.customer)}! The PIN was correct.</div>`;
    }else{
      body.innerHTML=`<h3>Enter your PIN</h3>
        <div class="code" style="background:rgba(0,0,0,.25);border-color:rgba(120,220,255,.2);color:#cfe">${hi('if (entered == PIN)\n   openATM();\nelse\n   tryAgain();')}</div>
        <div class="sub">Hint: your PIN is <b>${esc(String(a.pin))}</b></div>`;
      body.appendChild(atmKeypad(v=>{
        // DECISION: compare what was typed with the saved PIN
        if(v===String(a.pin)){a.loggedIn=true;markStage(3);Audio_.correct();toast('✅ Login successful!');render();}
        else{Audio_.wrong();toast('❌ Incorrect PIN. Try again.');a.entry='';render();}
      }));
      const reset=el('button','abtn ghost','Reset');reset.onclick=()=>{a.entry='';render();};
      body.appendChild(reset);
    }
    return stageBox(3,body);
  }

  /* ---------- STAGE 4 · MAIN MENU (Switch) ---------- */
  if(n===4){
    const body=el('div');
    const opts=[['balance','💰','Balance'],['deposit','➕','Deposit'],['withdraw','➖','Withdraw'],['statement','🧾','Mini Statement'],['fastcash','⚡','Fast Cash'],['exit','🚪','Exit']];
    const wiredCount=opts.filter(o=>a.menuWired[o[0]]).length;
    // show the switch being built, one case at a time
    let cases='';opts.forEach((o,i)=>{if(a.menuWired[o[0]])cases+=`\n   case ${i+1}: ${o[2]}();`;});
    body.innerHTML=`<h3>Wire up the menu</h3><div class="sub">Tap each option to add it as one <b>switch case</b>.</div>
      <div class="code" style="background:rgba(0,0,0,.25);border-color:rgba(120,220,255,.2);color:#cfe">${hi('switch (choice) {'+cases+'\n}')}</div>`;
    const grid=el('div','menu-grid');
    opts.forEach((o,i)=>{const mi=el('div','menu-item'+(a.menuWired[o[0]]?' wired':''),`<span class="mi">${o[1]}</span>${o[2]}`);
      mi.onclick=()=>{a.menuWired[o[0]]=!a.menuWired[o[0]];Audio_.pick();
        if(opts.every(x=>a.menuWired[x[0]])&&a.progress<4){markStage(4);Audio_.correct();Confetti.celebrate();toast('✅ Menu wired with 6 switch cases!');}
        render();};
      grid.appendChild(mi);});
    body.appendChild(grid);
    if(a.progress<4)body.appendChild(el('div','sub',`${wiredCount} / 6 options wired`));
    return stageBox(4,body);
  }

  /* ---------- STAGE 5 · BALANCE ENQUIRY (Variables · Output) ---------- */
  if(n===5){
    const body=el('div');
    body.innerHTML=`<h3>Balance Enquiry</h3><div class="sub">The screen reads the <b>balance</b> variable and shows it (output).</div>`;
    const card=el('div','bal-card',`<div class="lbl">AVAILABLE BALANCE</div><div class="amt">${rupees(a.balance)}</div>`);
    body.appendChild(card);
    const rf=el('button','abtn','🔄 Refresh Balance');
    rf.onclick=()=>{markStage(5);Audio_.correct();toast('Balance refreshed ✅');render();};
    body.appendChild(rf);
    return stageBox(5,body);
  }

  /* ---------- STAGE 6 · DEPOSIT (Operators · Input · Variables) ---------- */
  if(n===6){
    const body=el('div');
    body.innerHTML=`<h3>Deposit Money</h3>
      <div class="sub">Formula: <b>balance = balance + amount</b> (the + operator).</div>`;
    const f=el('div','field atm-field');const amt=el('input');amt.type='number';amt.inputMode='numeric';amt.placeholder='Enter amount';f.appendChild(amt);body.appendChild(f);
    const card=el('div','bal-card',`<div class="lbl">BALANCE</div><div class="amt">${rupees(a.balance)}</div>`);body.appendChild(card);
    const dep=el('button','abtn gold','Deposit 💵');
    dep.onclick=()=>{const v=Number(amt.value);if(!(v>0)){toast('Enter an amount');Audio_.wrong();return;}
      a.balance=a.balance+v;              // OPERATOR: add
      pushTxn('Deposit',v);moneyAnim('💵');Audio_.correct();markStage(6);toast('✅ Deposited '+rupees(v));render();};
    body.appendChild(dep);
    return stageBox(6,body);
  }

  /* ---------- STAGE 7 · WITHDRAW (Operators · Decision) ---------- */
  if(n===7){
    const body=el('div');
    body.innerHTML=`<h3>Withdraw Money</h3>
      <div class="code" style="background:rgba(0,0,0,.25);border-color:rgba(120,220,255,.2);color:#cfe">${hi('if (amount > balance)\n   "Insufficient Balance"\nelse\n   balance = balance - amount')}</div>`;
    const f=el('div','field atm-field');const amt=el('input');amt.type='number';amt.inputMode='numeric';amt.placeholder='Enter amount';f.appendChild(amt);body.appendChild(f);
    const card=el('div','bal-card',`<div class="lbl">BALANCE</div><div class="amt">${rupees(a.balance)}</div>`);body.appendChild(card);
    const wd=el('button','abtn','Withdraw 💸');
    wd.onclick=()=>{const v=Number(amt.value);if(!(v>0)){toast('Enter an amount');Audio_.wrong();return;}
      // DECISION: enough money?
      if(v>a.balance){toast('❌ Insufficient Balance');Audio_.wrong();return;}
      a.balance=a.balance-v;              // OPERATOR: subtract
      pushTxn('Withdraw',-v);Audio_.correct();markStage(7);
      const rec=el('div','atm-receipt',`CODE BANK — RECEIPT<br>Withdrawn: ${rupees(v)}<br>Balance: ${rupees(a.balance)}<br>Thank you!`);
      body.appendChild(rec);moneyAnim('💸');toast('✅ Withdrawn '+rupees(v));render();};
    body.appendChild(wd);
    return stageBox(7,body);
  }

  /* ---------- STAGE 8 · FAST CASH (Switch) ---------- */
  if(n===8){
    const body=el('div');
    body.innerHTML=`<h3>Fast Cash</h3><div class="sub">Each button is one <b>switch case</b> that withdraws a fixed amount.</div>`;
    const amounts=[500,1000,2000,5000,10000];
    amounts.forEach(amt=>{const b=el('button','abtn ghost','Withdraw '+rupees(amt));b.style.marginBottom='7px';
      b.onclick=()=>{ // SWITCH: choose the case that matches the button
        if(amt>a.balance){toast('❌ Insufficient Balance');Audio_.wrong();return;}
        a.balance-=amt;pushTxn('Fast Cash',-amt);moneyAnim('💵');Audio_.correct();markStage(8);toast('✅ '+rupees(amt)+' dispensed');render();};
      body.appendChild(b);});
    body.appendChild(el('div','bal-card',`<div class="lbl">BALANCE</div><div class="amt">${rupees(a.balance)}</div>`));
    return stageBox(8,body);
  }

  /* ---------- STAGE 9 · MINI STATEMENT (Loops) ---------- */
  if(n===9){
    if(a.transactions.length===0){pushTxn('Deposit',2000);pushTxn('Withdraw',-500);pushTxn('Fast Cash',-1000);} // sample data
    const body=el('div');
    body.innerHTML=`<h3>Mini Statement</h3><div class="sub">A <b>loop</b> goes through your transactions and makes one card for each.</div>`;
    if(a.progress>=9){body.appendChild(statementList());}
    else{const v=el('button','abtn gold','🧾 View Last 5 Transactions');
      v.onclick=()=>{markStage(9);Audio_.correct();render();};body.appendChild(v);}
    return stageBox(9,body);
  }

  /* ---------- STAGE 10 · DECORATOR (Nested Loops · Patterns) ---------- */
  if(n===10){
    const body=el('div');
    body.innerHTML=`<h3>Decorate your ATM</h3><div class="sub">Pick a colour, then a <b>nested loop</b> draws a decorative pattern.</div>`;
    const sw=el('div','opt-row');
    ['#38e1ff','#9bff5e','#ffd23f','#ff4d9d','#a855ff','#ff8a5c'].forEach(col=>{
      const s=el('button','swatch'+(a.deco.color===col&&a.deco.colorChosen?' active':''));s.style.background=col;
      s.onclick=()=>{a.deco.color=col;a.deco.colorChosen=true;Audio_.click();checkDeco();render();};sw.appendChild(s);});
    body.appendChild(sw);
    const gen=el('button','abtn','✨ Generate Pattern');gen.style.margin='8px 0';
    gen.onclick=()=>{a.deco.pattern=true;Audio_.pick();checkDeco();render();};
    body.appendChild(gen);
    if(a.deco.pattern)body.appendChild(decoGrid(a.deco.color));
    return stageBox(10,body);
  }
}
function checkDeco(){const a=state.atm;if(a.deco.colorChosen&&a.deco.pattern&&a.progress<10){markStage(10);Audio_.correct();Confetti.celebrate();toast('✅ ATM decorated!');}}
function decoGrid(color){
  const rows=5,cols=5;const g=el('div','deco-grid');g.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  // NESTED LOOP: outer loop picks the row, inner loop fills each column -> a pattern
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const on=(r+c)%2===0;const cell=el('div','d');
      cell.style.background=on?color:'transparent';cell.style.border='1px solid '+color+'55';
      cell.textContent=on?'✦':'';g.appendChild(cell);
    }
  }
  return g;
}
function statementList(){
  const list=el('div','txn-list');const tx=state.atm.transactions;
  const start=Math.max(0,tx.length-5);
  // LOOP through the last five transactions (newest first)
  for(let i=tx.length-1;i>=start;i--){const t=tx[i];const pos=t.amount>=0;
    list.appendChild(el('div','txn',`<span class="t-type">${pos?'⬇️':'⬆️'} ${esc(t.type)}</span><span class="amt ${pos?'pos':'neg'}">${pos?'+':'-'}${rupees(Math.abs(t.amount))}</span>`));}
  if(tx.length===0)list.appendChild(el('div','sub','No transactions yet.'));
  return list;
}

/* ---------- FINAL TEST · everything works together ---------- */
function initFinal(){const a=state.atm;a.loggedIn=false;a.view='welcome';a.entry='';a.used={};}
function atmFinalTest(){
  const a=state.atm;const box=el('div');
  box.appendChild(learnBanner('🏆','Final Test — use every feature together, just like real software.'));
  const need=[['login','Login 🔐'],['balance','Check Balance 💰'],['deposit','Deposit ➕'],['withdraw','Withdraw ➖'],['fastcash','Fast Cash ⚡'],['statement','Mini Statement 🧾'],['exit','Exit 🚪']];
  const chk=el('div','glass card');chk.innerHTML='<div class="eyebrow">Mission checklist</div>';
  const list=el('div','checklist');
  need.forEach(([k,label])=>{const d=!!a.used[k];list.appendChild(el('div','check-item'+(d?' done':''),`<span class="box">${d?'✓':''}</span> ${label}`));});
  chk.appendChild(list);box.appendChild(chk);
  box.appendChild(atmFrame(finalBody(),{blink:!a.loggedIn}));
  if(need.every(([k])=>a.used[k])){const b=el('button','btn gold','🎉 Complete the ATM!');b.onclick=completeATM;
    const f=el('div','footbar');f.style.justifyContent='center';f.appendChild(b);box.appendChild(f);}
  return box;
}
function finalBody(){
  const a=state.atm;const body=el('div');
  const back=()=>{const b=el('button','abtn ghost','← Back to Menu');b.onclick=()=>{a.view='menu';render();};return b;};
  if(!a.loggedIn){
    if(a.view!=='login'){body.innerHTML=`<h3>${esc(a.bank)}</h3><div class="sub">Insert your card to begin.</div>`;
      const b=el('button','abtn gold','Insert Card 💳');b.onclick=()=>{a.view='login';a.entry='';render();};body.appendChild(b);return body;}
    body.innerHTML=`<h3>Enter PIN</h3><div class="sub">Hint: ${esc(String(a.pin))}</div>`;
    body.appendChild(atmKeypad(v=>{if(v===String(a.pin)){a.loggedIn=true;a.used.login=true;a.view='menu';a.entry='';Audio_.correct();toast('✅ Logged in');render();}
      else{Audio_.wrong();toast('❌ Wrong PIN');a.entry='';render();}}));
    return body;
  }
  if(a.view==='menu'){
    body.innerHTML=`<h3>Main Menu</h3><div class="sub">Choose an option (switch).</div>`;
    const grid=el('div','menu-grid');
    [['balance','💰','Balance'],['deposit','➕','Deposit'],['withdraw','➖','Withdraw'],['fastcash','⚡','Fast Cash'],['statement','🧾','Statement'],['exit','🚪','Exit']].forEach(([v,ic,label])=>{
      const mi=el('div','menu-item'+(a.used[v]?' wired':''),`<span class="mi">${ic}</span>${label}`);
      mi.onclick=()=>{Audio_.click();
        if(v==='exit'){a.used.exit=true;a.loggedIn=false;a.view='welcome';toast('👋 Thank you for banking!');render();return;}
        if(v==='balance')a.used.balance=true;
        if(v==='statement')a.used.statement=true;
        a.view=v;render();};
      grid.appendChild(mi);});
    body.appendChild(grid);return body;
  }
  if(a.view==='balance'){body.innerHTML='<h3>Balance</h3>';
    body.appendChild(el('div','bal-card',`<div class="lbl">AVAILABLE BALANCE</div><div class="amt">${rupees(a.balance)}</div>`));body.appendChild(back());return body;}
  if(a.view==='deposit'){body.innerHTML='<h3>Deposit</h3>';
    const f=el('div','field atm-field');const amt=el('input');amt.type='number';amt.inputMode='numeric';amt.placeholder='Amount';f.appendChild(amt);body.appendChild(f);
    const b=el('button','abtn gold','Deposit 💵');b.onclick=()=>{const v=Number(amt.value);if(!(v>0)){toast('Enter an amount');return;}
      a.balance+=v;pushTxn('Deposit',v);a.used.deposit=true;moneyAnim('💵');Audio_.correct();toast('✅ +'+rupees(v));a.view='menu';render();};
    body.appendChild(b);body.appendChild(back());return body;}
  if(a.view==='withdraw'){body.innerHTML='<h3>Withdraw</h3>';
    const f=el('div','field atm-field');const amt=el('input');amt.type='number';amt.inputMode='numeric';amt.placeholder='Amount';f.appendChild(amt);body.appendChild(f);
    const b=el('button','abtn','Withdraw 💸');b.onclick=()=>{const v=Number(amt.value);if(!(v>0)){toast('Enter an amount');return;}
      if(v>a.balance){toast('❌ Insufficient Balance');Audio_.wrong();return;}
      a.balance-=v;pushTxn('Withdraw',-v);a.used.withdraw=true;moneyAnim('💸');Audio_.correct();toast('✅ -'+rupees(v));a.view='menu';render();};
    body.appendChild(b);body.appendChild(back());return body;}
  if(a.view==='fastcash'){body.innerHTML='<h3>Fast Cash</h3>';
    [500,1000,2000,5000,10000].forEach(amt=>{const b=el('button','abtn ghost',rupees(amt));b.style.marginBottom='7px';
      b.onclick=()=>{if(amt>a.balance){toast('❌ Insufficient Balance');Audio_.wrong();return;}
        a.balance-=amt;pushTxn('Fast Cash',-amt);a.used.fastcash=true;moneyAnim('💵');Audio_.correct();toast('✅ '+rupees(amt));a.view='menu';render();};
      body.appendChild(b);});
    body.appendChild(back());return body;}
  if(a.view==='statement'){body.innerHTML='<h3>Mini Statement</h3>';body.appendChild(statementList());body.appendChild(back());return body;}
  return body;
}
function completeATM(){
  state.atm.done=true;state.xp+=300;Audio_.win();syncProgress();
  Confetti.fireworks();moneyAnim('🪙',30);setTimeout(()=>moneyAnim('💵',24),500);
  state.atm.stage=12;render();
}
function atmDone(){
  setTimeout(()=>{Confetti.fireworks();moneyAnim('🪙',26);},200);
  const box=el('div');
  const c=el('div','card glass complete');
  c.innerHTML=`<div class="badge-earned">🏆</div>
    <div class="eyebrow" style="justify-content:center">Capstone Complete</div>
    <h1 style="background:linear-gradient(135deg,#38e1ff,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent">CONGRATULATIONS!</h1>
    <p style="font-family:var(--font-display);font-weight:700;font-size:1.15rem">${esc(state.name)}, you built your first software application — a working ATM machine.</p>
    <div class="feat" style="justify-content:center;margin-top:8px">
      <span>✔ Hello World</span><span>✔ Variables</span><span>✔ Data Types</span><span>✔ Input</span><span>✔ Operators</span><span>✔ Decisions</span><span>✔ Switch</span><span>✔ Loops</span><span>✔ Patterns</span></div>
    <p class="muted" style="font-weight:700;margin-top:14px">Welcome to the world of programming. 🎉</p>`;
  const foot=el('div','footbar');foot.style.justifyContent='center';
  const cert=el('button','btn gold','📜 Download Certificate');cert.onclick=()=>makeATMCert();
  const map=el('button','btn','🗺️ Back to Quest Map');map.onclick=()=>{Audio_.click();state.screen='map';render();};
  foot.appendChild(cert);foot.appendChild(map);c.appendChild(foot);
  box.appendChild(c);
  box.appendChild(el('div','glass card center',`<div class="muted" style="font-weight:700">🏰 The Final Castle is now unlocked on your Quest Map!</div>`));
  return box;
}

// generic certificate drawer (used by the ATM project)
function drawCertificate(o){
  const W=1240,H=877,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#0e2233');grad.addColorStop(.5,'#12324a');grad.addColorStop(1,'#0a1a2b');
  g.fillStyle=grad;g.fillRect(0,0,W,H);
  const glow=(x,y,r,col)=>{const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,col);rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);};
  glow(200,140,420,'rgba(56,225,255,.42)');glow(1050,760,460,'rgba(255,210,63,.34)');
  g.strokeStyle='rgba(255,210,63,.9)';g.lineWidth=6;g.strokeRect(40,40,W-80,H-80);
  g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=2;g.strokeRect(58,58,W-116,H-116);
  const cx=W/2;g.textAlign='center';
  g.fillStyle='#ffd23f';g.font='900 30px "Baloo 2",Arial';g.fillText(o.brand,cx,150);
  g.fillStyle='#a9d6ea';g.font='700 22px Arial';g.fillText('CERTIFICATE OF COMPLETION',cx,195);
  g.fillStyle='#e5f6ff';g.font='600 26px Arial';g.fillText('This certifies that',cx,285);
  g.fillStyle='#7fe7ff';g.font='900 64px "Baloo 2",Arial';g.fillText(state.name,cx,360);
  g.fillStyle='#e5f6ff';g.font='600 25px Arial';g.fillText(o.line1,cx,423);
  g.fillStyle='#9bff5e';g.font='800 36px "Baloo 2",Arial';g.fillText(o.line2,cx,476);
  g.font='58px Arial';g.fillText(o.emoji||'🏆',cx,562);
  g.fillStyle='#ffd23f';g.font='800 24px "Baloo 2",Arial';g.fillText(o.badge,cx,616);
  const date=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
  g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=2;g.beginPath();g.moveTo(230,720);g.lineTo(500,720);g.stroke();g.beginPath();g.moveTo(740,720);g.lineTo(1010,720);g.stroke();
  g.fillStyle='#a9d6ea';g.font='600 20px Arial';g.fillText(date,365,706);g.fillText('Date',365,750);g.fillText('Level Up Academy',875,706);g.fillText('Instructor',875,750);
  try{const jsPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;if(!jsPDF)throw 0;
    const pdf=new jsPDF({orientation:'landscape',unit:'px',format:[W,H]});pdf.addImage(cv.toDataURL('image/png'),'PNG',0,0,W,H);
    pdf.save(o.file+'_'+state.name.replace(/\s+/g,'_')+'.pdf');toast('📜 Certificate downloaded!');}
  catch(e){const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=o.file+'_'+state.name.replace(/\s+/g,'_')+'.png';a.click();toast('📜 Certificate saved!');}
}
function makeATMCert(){Audio_.click();drawCertificate({brand:'🏧 CODE BANK · LEVEL UP',
  line1:'has designed and built a fully working',line2:'ATM Machine using core programming concepts',
  badge:'★ Certified ATM Builder ★',emoji:'🏧',file:'ATM_Builder_Certificate'});}

(async()=>{
  try{ const resumed = await sbBoot(); if(resumed){ render(); return; } }
  catch(e){ console.warn('sbBoot error',e); }
  render();
})();
